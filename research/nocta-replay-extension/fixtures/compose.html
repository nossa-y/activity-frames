<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Compose fixture</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; }
  button, a { display:inline-block; margin:6px 0; padding:8px 14px; border:1px solid #ccc;
              border-radius:6px; background:#f5f5f5; cursor:pointer; text-decoration:none; color:#111; }
  #composer { border:1px solid #bbb; border-radius:8px; padding:10px; min-height:80px; margin:10px 0; }
  .sent { color: #b00; font-weight: bold; }
</style></head>
<body>
  <h2>Messaging</h2>
  <!-- tier 1: located by aria-label -->
  <button aria-label="Compose message" id="compose">New message</button>
  <!-- tier 1 via accessible-name-from-text -->
  <a id="drafts" href="#">Drafts</a>
  <!-- tier 2: no aria-label, accessible name ("Save draft now") != plan target ("Save draft");
       only a visible-text CONTAINS match finds it -->
  <button id="savedraft">Save draft now</button>

  <div id="composer" role="textbox" contenteditable="true" aria-label="Write a message"
       data-placeholder="Write a message"></div>

  <!-- destructive: must be BLOCKED by the executor's safety gate -->
  <button aria-label="Send" id="send" onclick="document.getElementById('log').textContent='SENT (should never happen in replay)'; this.classList.add('sent')">Send</button>

  <div id="log"></div>
  <script>
    // record interactions so the test can assert what actually happened
    window.__events = [];
    document.getElementById('compose').addEventListener('click', function(){ window.__events.push('compose-clicked'); });
    document.getElementById('drafts').addEventListener('click', function(e){ e.preventDefault(); window.__events.push('drafts-clicked'); });
    document.getElementById('savedraft').addEventListener('click', function(){ window.__events.push('savedraft-clicked'); });
    document.getElementById('composer').addEventListener('input', function(){ window.__events.push('composer-typed:' + this.textContent); });
    document.getElementById('send').addEventListener('click', function(){ window.__events.push('SEND-CLICKED'); });
  </script>
</body>
</html>
