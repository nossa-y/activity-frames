<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  body { font: 13px sans-serif; width: 360px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  textarea { width: 100%; height: 150px; font: 11px monospace; box-sizing: border-box; }
  button { margin-top: 8px; padding: 7px 12px; border-radius: 6px; border: 1px solid #888;
           background: #f4f4f4; cursor: pointer; }
  #run { background: #111; color: #fff; border-color: #111; }
  label { display: block; margin-top: 8px; }
  pre { background: #f6f6f6; padding: 8px; border-radius: 6px; max-height: 180px; overflow: auto;
        font-size: 11px; white-space: pre-wrap; }
  .warn { color: #b00; }
</style></head>
<body>
  <h1>Nocta Replay</h1>
  <div>Paste a compiled routine plan (from <code>compile_replay.py</code>) and replay it deterministically on this tab. No vision, no screenshots.</div>
  <textarea id="plan" placeholder='[{"op":"click","target":"Compose message","role":"button","guard":{"expect_element":"Compose message"}}, {"op":"type","target":"Write a message","value":"hello","guard":{}}]'></textarea>
  <label><input type="checkbox" id="dry" checked> Dry run (locate + guard-check only, do not click/type)</label>
  <label><input type="checkbox" id="allow"> <span class="warn">Allow destructive actions (send/post/pay) - off by default</span></label>
  <button id="run">Replay on this tab</button>
  <pre id="out"></pre>
  <script src="popup.js"></script>
</body>
</html>
