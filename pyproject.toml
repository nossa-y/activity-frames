[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "activity-frames"
dynamic = ["version"]
description = "Turn your workday into structured workflows agents can execute. 100% local, served over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Nossa Iyamu" }]
keywords = [
    "ai-agents", "mcp", "nocta-recorder", "episodic-memory", "context",
    "screen-activity", "agent-memory", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=7", "PyYAML>=6.0"]

[project.scripts]
aframes = "activity_frames.cli:main"

[project.urls]
Homepage = "https://github.com/nossa-y/activity-frames"
Repository = "https://github.com/nossa-y/activity-frames"
Issues = "https://github.com/nossa-y/activity-frames/issues"

[tool.hatch.version]
path = "src/activity_frames/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/activity_frames"]

# The published source distribution ships the library + docs only. Research
# artifacts, the paper, and benchmarks are development material (and may carry
# corpus-derived previews), so they are kept out of the distribution.
[tool.hatch.build.targets.sdist]
exclude = ["/research", "/paper", "/benchmark", "/dist", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
